qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # Gemma 27B attention and MLP projection layers
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

sft:
  learning_rate: 2.0e-5
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_seq_length: 2048
  optimizer: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 50
  save_total_limit: 3
  fp16: false
  bf16: true
  seed: 42
  output_dir: "./experiments/checkpoints/sft"

raft:
  learning_rate: 1.0e-5
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_seq_length: 2048
  optimizer: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 50
  save_total_limit: 3
  fp16: false
  bf16: true
  seed: 42
  distractor_ratio: 0.5
  num_distractor_passages: 3
  output_dir: "./experiments/checkpoints/raft"
