version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medfusion-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEDFUSION_CONFIG_DIR=/app/configs
      - MEDFUSION_DATA_DIR=/app/data
      - MEDFUSION_LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./experiments:/app/experiments
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medfusion-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - MEDFUSION_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
